<script>
(function () {
  if (window.top !== window.self) { document.body.textContent = ''; return; }   // no framing
  const box = JSON.parse(document.getElementById('box').textContent);
  const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const idb = (mode, fn) => new Promise((res) => {
    try {
      const r = indexedDB.open('assay-pipeline', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('k');
      r.onsuccess = () => {
        const tx = r.result.transaction('k', mode), q = fn(tx.objectStore('k'));
        tx.oncomplete = () => res(q && q.result); tx.onerror = () => res(null);
      };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  const saved = { get: () => idb('readonly', (s) => s.get('key')), put: (k) => idb('readwrite', (s) => s.put(k, 'key')),
                  drop: () => idb('readwrite', (s) => s.delete('key')) };

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(box.salt), iterations: box.iter },
                                   base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);   // non-extractable
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(box.iv) }, key, u8(box.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function mount(p) {
    // Stand-in for the claude.ai dashboard's `dash` API: data is already here, so every source is "ok".
    const calcs = {}, draws = {};
    const runOne = (name) => {
      const d = draws[name]; if (!d) return;
      document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => {
        try {
          if (typeof d.spec === 'function') return d.spec(el);
          if (!d.made.has(el)) { el.replaceChildren(); d.made.set(el, d.spec.mount ? d.spec.mount(el) : undefined); }
          if (d.spec.update) d.spec.update(el, d.made.get(el));
        } catch (e) { console.error('draw ' + name, e); }
      });
    };
    window.dash = {
      data(id) {
        const v = id in p.data ? p.data[id] : (calcs[id] || {}).value;
        if (v === undefined) return { status: 'missing', data: [] };
        return { status: 'ok', data: v, columns: Array.isArray(v) && v[0] ? Object.keys(v[0]) : [] };
      },
      calc(id, c) { calcs[id] = { value: c.fn(...c.inputs.map((i) => window.dash.data(i).data)) }; },
      draw(name, spec) { if (spec) draws[name] = { spec, made: new Map() }; else runOne(name); },
      onData(fn) { fn(); }, loader() {}, refresh() {}, setLink() {}, params() { return {}; },
      setParams() {}, resetParams() {}, colors: ['var(--sage)', 'var(--bone)', 'var(--stone)']
    };
    const root = document.getElementById('dash-root');
    root.innerHTML = p.page;
    root.querySelectorAll('script').forEach((old) => {      // innerHTML never runs scripts; the CSP allows these by hash
      const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s);
    });
    const all = () => Object.keys(draws).forEach(runOne);
    all();
    let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(all, 150); });
    document.getElementById('asof').textContent =
      'Data as of ' + new Date(p.updated).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    document.getElementById('lock').hidden = true; root.hidden = false; document.getElementById('foot').hidden = false;
  }

  const err = document.getElementById('err');
  document.getElementById('unlock').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = 'Opening…';
    const pw = document.getElementById('pw');
    try {
      const key = await derive(pw.value), p = await open(key);
      if (document.getElementById('keep').checked) await saved.put(key);
      pw.value = '';
      mount(p);
    } catch (x) { err.textContent = 'That passphrase did not open it. Check it and try again.'; }
  });
  document.getElementById('forget').addEventListener('click', async () => { await saved.drop(); location.reload(); });
  saved.get().then(async (key) => {
    if (!key) return;
    try { mount(await open(key)); } catch (x) { await saved.drop(); }     // passphrase changed: ask again
  });
})();
</script>
</body></html>
